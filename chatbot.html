<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asisten Virtual Imigrasi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ========================= CSS VARIABLES ========================= */
:root {
  --navy:       #0B3D91;
  --navy-dark:  #071f4a;
  --navy-mid:   #132680;
  --gold:       #E8B84B;
  --gold-light: #f5d077;
  --white:      #ffffff;
  --glass-bg:   rgba(255,255,255,0.10);
  --glass-border: rgba(255,255,255,0.20);
  --glass-input: rgba(255,255,255,0.18);
  --bubble-bot:  rgba(255,255,255,0.95);
  --bubble-user: #1a35a0;
  --text-bot:    #0f1f55;
  --radius-lg:  20px;
  --radius-md:  14px;
  --radius-sm:  10px;

  /* Skala typography responsif */
  --fs-header:  clamp(14px, 2vw, 26px);
  --fs-subheader: clamp(11px, 1.2vw, 15px);
  --fs-msg:     clamp(13px, 1.1vw, 16px);
  --fs-input:   clamp(13px, 1vw, 15px);
  --fs-btn:     clamp(12px, 0.9vw, 14px);

  /* Karakter */
  --char-size:  clamp(160px, 18vw, 340px);
}

/* ========================= RESET ========================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ========================= BODY ========================= */
body {
  font-family: 'DM Sans', Arial, sans-serif;
  background:
    linear-gradient(160deg, rgba(7,31,74,0.85) 0%, rgba(11,61,145,0.80) 60%, rgba(19,38,128,0.88) 100%),
    url('bg.jpg') center/cover no-repeat fixed;
  color: var(--white);
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ========================= HEADER ========================= */
header {
  width: 100%;
  padding: clamp(10px, 2vh, 18px) clamp(16px, 3vw, 40px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--glass-border);
  position: relative;
  z-index: 10;
  flex-shrink: 0;
}

.header-logo {
  width: clamp(32px, 4vw, 54px);
  height: clamp(32px, 4vw, 54px);
  object-fit: contain;
  flex-shrink: 0;
}

.header-text { text-align: center; }

.header-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: var(--fs-header);
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1.2;
  color: var(--white);
}

.header-sub {
  font-size: var(--fs-subheader);
  color: var(--gold-light);
  font-weight: 500;
  letter-spacing: 0.06em;
  margin-top: 2px;
}

/* ========================= BACK BUTTON ========================= */
#back {
  position: fixed;
  top: clamp(10px, 2vh, 20px);
  left: clamp(12px, 2vw, 24px);
  padding: 8px 16px;
  border-radius: 30px;
  background: rgba(255,255,255,0.12);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(10px);
  cursor: pointer;
  font-size: clamp(11px, 0.9vw, 13px);
  font-weight: 500;
  color: var(--white);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.2s;
  text-decoration: none;
}
#back:hover { background: rgba(255,255,255,0.22); }
#back::before { content: '←'; font-size: 1.1em; }

/* ========================= MAIN LAYOUT ========================= */
#container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(8px, 2vh, 20px) clamp(8px, 2vw, 20px);
  overflow: hidden;
  position: relative;
}

/* ========================= CHARACTERS ========================= */
#charLeft, #charRight {
  position: absolute;
  bottom: 0;
  z-index: 2;
  pointer-events: none;
  user-select: none;
}
#charLeft  { left:  clamp(-30px, -1vw, 0px); }
#charRight { right: clamp(-30px, -1vw, 0px); }

#charLeft img, #charRight img {
  width: var(--char-size);
  display: block;
  animation: float 3.2s ease-in-out infinite;
  filter: drop-shadow(0 10px 30px rgba(0,0,0,0.35));
  transition: transform 0.3s ease;
}
#charRight img { animation-delay: 0.4s; }

@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}

.talking {
  animation: talking 0.25s ease-in-out infinite alternate !important;
  filter: drop-shadow(0 10px 30px rgba(232,184,75,0.45)) !important;
}
@keyframes talking {
  0%   { transform: translateY(-2px) scale(1.02); }
  100% { transform: translateY(2px)  scale(1.04); }
}

/* ========================= CHAT BOX ========================= */
#chatBox {
  width: 100%;
  max-width: clamp(480px, 55vw, 860px);
  height: 100%;
  max-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  z-index: 5;
  box-shadow: 0 24px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
}

/* ========================= CHAT MESSAGES ========================= */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: clamp(12px, 2vh, 24px) clamp(12px, 2vw, 22px);
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

/* Custom scrollbar */
#chat::-webkit-scrollbar { width: 5px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

/* Wrapper untuk label + bubble */
.msg-wrap {
  display: flex;
  flex-direction: column;
  max-width: 72%;
  animation: msgIn 0.28s ease both;
}
.msg-wrap.user { align-self: flex-end; align-items: flex-end; }
.msg-wrap.bot  { align-self: flex-start; align-items: flex-start; }

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-label {
  font-size: clamp(10px, 0.75vw, 11px);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 4px;
  opacity: 0.65;
}
.msg-wrap.user .msg-label { color: var(--gold-light); }
.msg-wrap.bot  .msg-label { color: rgba(255,255,255,0.7); }

.message {
  padding: clamp(10px, 1.2vh, 14px) clamp(14px, 1.5vw, 18px);
  border-radius: var(--radius-md);
  font-size: var(--fs-msg);
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}

.user.message {
  background: var(--bubble-user);
  color: var(--white);
  border-bottom-right-radius: 4px;
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}

.bot.message {
  background: var(--bubble-bot);
  color: var(--text-bot);
  border-bottom-left-radius: 4px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
}

/* Typing indicator */
.typing-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #94a3b8;
  margin: 0 2px;
  animation: blink 1.2s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%,80%,100% { opacity: 0.2; transform: scale(0.85); }
  40%          { opacity: 1;   transform: scale(1); }
}

/* ========================= INPUT AREA ========================= */
#inputArea {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: clamp(10px, 1.5vh, 16px) clamp(12px, 1.5vw, 18px);
  background: rgba(0,0,0,0.2);
  border-top: 1px solid var(--glass-border);
  flex-shrink: 0;
}

#userInput {
  flex: 1;
  padding: clamp(10px, 1.2vh, 13px) clamp(14px, 1.5vw, 18px);
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  background: var(--glass-input);
  backdrop-filter: blur(8px);
  color: var(--white);
  font-size: var(--fs-input);
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  min-width: 0;
}
#userInput::placeholder { color: rgba(255,255,255,0.45); }
#userInput:focus {
  border-color: var(--gold);
  background: rgba(255,255,255,0.22);
}

/* Tombol aksi input */
.btn-action {
  flex-shrink: 0;
  width:  clamp(38px, 4vw, 50px);
  height: clamp(38px, 4vw, 50px);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s, background 0.2s;
}
.btn-action:active { transform: scale(0.92); }

#sendBtn {
  background: var(--gold);
  color: var(--navy-dark);
  box-shadow: 0 4px 14px rgba(232,184,75,0.45);
}
#sendBtn:hover { background: var(--gold-light); }

#voiceBtn {
  background: rgba(255,255,255,0.15);
  color: var(--white);
  border: 1px solid var(--glass-border);
}
#voiceBtn:hover  { background: rgba(255,255,255,0.25); }
#voiceBtn.active { background: #ef4444; border-color: #ef4444; }

/* SVG icon size */
.btn-action svg {
  width:  clamp(16px, 1.5vw, 22px);
  height: clamp(16px, 1.5vw, 22px);
}

/* ========================= STATUS BAR ========================= */
#statusBar {
  text-align: center;
  font-size: clamp(10px, 0.8vw, 12px);
  color: rgba(255,255,255,0.5);
  padding: 4px 0 0;
  min-height: 16px;
  flex-shrink: 0;
  letter-spacing: 0.03em;
}

/* ========================= TV / LARGE SCREEN ========================= */
@media (min-width: 1600px) {
  :root {
    --char-size: clamp(300px, 20vw, 440px);
  }
  #chatBox {
    max-width: 900px;
  }
}

/* ========================= TABLET / MEDIUM SCREEN ========================= */
@media (max-width: 1100px) {
  :root { --char-size: clamp(120px, 14vw, 220px); }
  #charLeft  { left:  -10px; }
  #charRight { right: -10px; }
}

/* ========================= MOBILE / SMALL SCREEN ========================= */
@media (max-width: 720px) {
  #charLeft, #charRight { display: none; }
  #chatBox { max-width: 100%; border-radius: var(--radius-md); }
  #container { padding: 8px; }
  .msg-wrap { max-width: 85%; }
}

/* ========================= WELCOME MSG ========================= */
.welcome-chip {
  align-self: center;
  background: rgba(232,184,75,0.15);
  border: 1px solid rgba(232,184,75,0.35);
  color: var(--gold-light);
  padding: 6px 16px;
  border-radius: 30px;
  font-size: clamp(11px, 0.85vw, 13px);
  font-weight: 500;
  margin-bottom: 8px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <img class="header-logo" src="logo-imigrasi.png" alt="Logo Imigrasi" onerror="this.style.display='none'">
  <div class="header-text">
    <div class="header-title">ASISTEN VIRTUAL IMIGRASI</div>
    <div class="header-sub">Kantor Wilayah Ditjen Imigrasi Sulawesi Selatan</div>
  </div>
</header>

<!-- BACK -->
<a id="back" href="index.html">Beranda</a>

<!-- KARAKTER KIRI -->
<div id="charLeft">
  <img id="menChar" src="idle-men.png" alt="Maskot Petugas">
</div>

<!-- KARAKTER KANAN -->
<div id="charRight">
  <img id="womenChar" src="idle-women.png" alt="Maskot Petugas">
</div>

<!-- CONTAINER UTAMA -->
<div id="container">
  <div id="chatBox">

    <div id="chat">
      <!-- Pesan selamat datang otomatis -->
    </div>

    <div id="statusBar"></div>

    <div id="inputArea">
      <!-- Tombol voice -->
      <button class="btn-action" id="voiceBtn" title="Input suara" onclick="toggleVoice()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8"  y1="23" x2="16" y2="23"/>
        </svg>
      </button>

      <input id="userInput" type="text" placeholder="Tanyakan tentang layanan keimigrasian..." autocomplete="off">

      <!-- Tombol kirim -->
      <button class="btn-action" id="sendBtn" title="Kirim pesan" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>
</div>

<script>
/* ========================= UNLOCK AUDIO ========================= */
document.body.addEventListener("click", () => {
  let a = new Audio(); a.play().catch(()=>{});
}, { once: true });

/* ========================= STATUS ========================= */
const statusBar = document.getElementById("statusBar");
function setStatus(msg) { statusBar.textContent = msg; }
function clearStatus()  { statusBar.textContent = ""; }

/* ========================= KARAKTER ========================= */
let talkTimer = null;

function setCharacter(state) {
  const men   = document.getElementById("menChar");
  const women = document.getElementById("womenChar");
  if (!men || !women) return;

  clearTimeout(talkTimer);

  if (state === "talk") {
    men.src   = "talk-men.png";
    women.src = "talk-women.png";
    men.classList.add("talking");
    women.classList.add("talking");
  } else {
    men.src   = "idle-men.png";
    women.src = "idle-women.png";
    men.classList.remove("talking");
    women.classList.remove("talking");
  }
}

/* ========================= CHAT ========================= */
function addMessage(text, type, isTyping = false) {
  const chat = document.getElementById("chat");

  const wrap = document.createElement("div");
  wrap.className = "msg-wrap " + type;

  const label = document.createElement("div");
  label.className = "msg-label";
  label.textContent = type === "user" ? "Anda" : "Asisten Imigrasi";

  const div = document.createElement("div");
  div.className = "message " + type;

  if (isTyping) {
    div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  } else {
    div.textContent = text;
  }

  wrap.appendChild(label);
  wrap.appendChild(div);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;

  return div;
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  botReply(message);
}

document.getElementById("userInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
});

/* ========================= BROWSER TTS ========================= */
function playBrowserTTS(text) {
  if (!("speechSynthesis" in window)) { setCharacter("idle"); return; }
  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "id-ID";
  utter.rate = 0.95;
  utter.pitch = 1.05;

  const voices = speechSynthesis.getVoices();
  const indo = voices.find(v => v.lang === "id-ID" || v.lang.startsWith("id"));
  if (indo) utter.voice = indo;

  utter.onstart = () => setCharacter("talk");
  utter.onend   = () => { setCharacter("idle"); clearStatus(); };
  utter.onerror = () => { setCharacter("idle"); clearStatus(); };

  speechSynthesis.speak(utter);
}

speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

/* ========================= ELEVENLABS TTS + FALLBACK ========================= */
async function playTTS(text) {
  setStatus("🔊 Membaca jawaban...");
  try {
    const response = await fetch("https://imigrasi-ai.onrender.com/tts-eleven", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });

    if (!response.ok) throw new Error("ElevenLabs error");

    const blob = await response.blob();
    if (blob.size < 1000) throw new Error("Audio kosong");

    const audio = new Audio(URL.createObjectURL(blob));
    setCharacter("talk");
    audio.onended = () => { setCharacter("idle"); clearStatus(); };
    audio.onerror = () => { setCharacter("idle"); clearStatus(); };
    await audio.play();

  } catch {
    console.warn("⚠️ Fallback ke browser TTS");
    playBrowserTTS(text);
  }
}

/* ========================= BOT REPLY ========================= */
async function botReply(message) {
  const typingBubble = addMessage("", "bot", true);
  setStatus("⏳ Memproses pertanyaan...");

  try {
    const response = await fetch("https://imigrasi-ai.onrender.com/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });

    if (!response.ok) throw new Error("Server error " + response.status);

    const data = await response.json();
    const reply = data.reply || "Maaf, tidak ada jawaban yang diterima.";

    typingBubble.innerHTML = "";
    typingBubble.textContent = reply;
    clearStatus();

    playTTS(reply);

  } catch (err) {
    console.error(err);
    typingBubble.innerHTML = "";
    typingBubble.textContent = "Maaf, terjadi kesalahan koneksi. Silakan coba beberapa saat lagi atau hubungi petugas di loket layanan.";
    setCharacter("idle");
    clearStatus();
  }
}

/* ========================= VOICE INPUT ========================= */
let recognition = null;
let isListening = false;

function toggleVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    setStatus("❌ Browser tidak mendukung input suara");
    setTimeout(clearStatus, 2500);
    return;
  }

  if (isListening) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "id-ID";
  recognition.continuous = false;
  recognition.interimResults = true;

  const voiceBtn = document.getElementById("voiceBtn");

  recognition.onstart = () => {
    isListening = true;
    voiceBtn.classList.add("active");
    setStatus("🎙️ Sedang mendengarkan...");
    document.getElementById("userInput").placeholder = "Sedang mendengarkan...";
  };

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results)
      .map(r => r[0].transcript).join("");
    document.getElementById("userInput").value = transcript;

    if (e.results[e.results.length - 1].isFinal) {
      recognition.stop();
    }
  };

  recognition.onend = () => {
    isListening = false;
    voiceBtn.classList.remove("active");
    document.getElementById("userInput").placeholder = "Tanyakan tentang layanan keimigrasian...";
    clearStatus();

    const val = document.getElementById("userInput").value.trim();
    if (val) sendMessage();
  };

  recognition.onerror = (e) => {
    isListening = false;
    voiceBtn.classList.remove("active");
    document.getElementById("userInput").placeholder = "Tanyakan tentang layanan keimigrasian...";
    setStatus("❌ Gagal menangkap suara, coba lagi");
    setTimeout(clearStatus, 2000);
  };

  recognition.start();
}

/* ========================= IDLE RESET (kiosk) ========================= */
let idleTimer = null;
const IDLE_MINUTES = 3;

function resetIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    document.getElementById("chat").innerHTML = "";
    showWelcome();
    speechSynthesis.cancel();
    setCharacter("idle");
    clearStatus();
  }, IDLE_MINUTES * 60 * 1000);
}

["mousemove","keydown","touchstart","click"].forEach(evt =>
  document.addEventListener(evt, resetIdle, { passive: true })
);

/* ========================= WELCOME MESSAGE ========================= */
function showWelcome() {
  const chat = document.getElementById("chat");

  const chip = document.createElement("div");
  chip.className = "welcome-chip";
  chip.textContent = "Selamat Datang";
  chat.appendChild(chip);

  const wrap = document.createElement("div");
  wrap.className = "msg-wrap bot";

  const label = document.createElement("div");
  label.className = "msg-label";
  label.textContent = "Asisten Imigrasi";

  const div = document.createElement("div");
  div.className = "message bot";
  div.textContent = "Halo! Saya Asisten Virtual Imigrasi Sulawesi Selatan. 👋\n\nSaya siap membantu Anda mendapatkan informasi seputar layanan keimigrasian, seperti pembuatan paspor, izin tinggal, dan dokumen perjalanan lainnya.\n\nSilakan ketik pertanyaan Anda atau tekan tombol 🎙️ untuk berbicara.";

  wrap.appendChild(label);
  wrap.appendChild(div);
  chat.appendChild(wrap);
}

/* ========================= INIT ========================= */
showWelcome();
resetIdle();
</script>

</body>
</html>
